name: Release

on:
  push:
    tags:
      - "V-*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm version for trusted publishing
        shell: bash
        run: |
          npm install -g npm@latest
          npm --version

      - name: Validate tag and extract version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^V-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: V-X.X.X"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Align package version with tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Create project zip
        shell: bash
        run: |
          ZIP_NAME="inquirer-recursive-prompt-${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
               "node_modules/*" \
               ".github/workflows/*"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-zip-${{ steps.version.outputs.version }}
          path: inquirer-recursive-prompt-${{ steps.version.outputs.version }}.zip

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: inquirer-recursive-prompt-${{ steps.version.outputs.version }}.zip
